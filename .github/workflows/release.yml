name: Release

# Builds BA Space for Windows, macOS and Linux and uploads the installers to a draft GitHub release
# for the pushed tag (electron-builder publish config in package.json). Publish the draft by hand.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The node-pty prebuilds on npm can lose the exec bit on spawn-helper ("posix_spawnp failed").
      - name: Make node-pty spawn-helper executable
        if: runner.os == 'macOS'
        run: chmod +x node_modules/node-pty/prebuilds/darwin-*/spawn-helper

      - name: Test
        run: node --test src/domain/branch/index.test.js src/domain/device/index.test.js src/domain/project/index.test.js src/domain/settings/index.test.js src/domain/worktree/index.test.js

      - name: Build
        run: npm run build

      - name: Package and upload
        run: npx electron-builder ${{ matrix.target }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
